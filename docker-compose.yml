version: '3.8'

services:
  # DynamoDB Local
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: controle-vendas-dynamodb
    ports:
      - "8001:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - controle-vendas-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Backend (Python Lambda)
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: controle-vendas-api
    ports:
      - "8000:8000"
    environment:
      - AWS_REGION=sa-east-1
      - AWS_DEFAULT_REGION=sa-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - POWERTOOLS_SERVICE_NAME=controle-vendas-api
      - POWERTOOLS_LOG_LEVEL=INFO
      - TABLE_NAME=controle-vendas-dev
    volumes:
      - ./api/src:/app/src
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - controle-vendas-network
    restart: unless-stopped

  # Web Frontend (Angular) - Development Mode
  web-dev:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: controle-vendas-web-dev
    ports:
      - "4200:4200"
    environment:
      - API_URL=http://localhost:8000
      - NODE_ENV=development
    volumes:
      - ./web/src:/app/src
      - ./web/public:/app/public
      - /app/node_modules  # Prevent overwriting node_modules
    networks:
      - controle-vendas-network
    restart: unless-stopped
    profiles:
      - dev

  # Web Frontend (Angular) - Production Mode
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: controle-vendas-web
    ports:
      - "8080:80"
    environment:
      - API_URL=http://localhost:8000
    networks:
      - controle-vendas-network
    restart: unless-stopped
    profiles:
      - prod

  # DynamoDB Admin UI (optional)
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: controle-vendas-dynamodb-admin
    ports:
      - "8002:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      - dynamodb-local
    networks:
      - controle-vendas-network
    restart: unless-stopped
    profiles:
      - admin

networks:
  controle-vendas-network:
    driver: bridge

volumes:
  dynamodb-data:
    driver: local
