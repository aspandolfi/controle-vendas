name: E2E Tests

on:
  push:
    branches: [main, develop, staging]
    paths:
      - 'web/**'
      - 'api/**'
      - 'docker-compose.yml'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [main, develop, staging]
    paths:
      - 'web/**'
      - 'api/**'
      - 'docker-compose.yml'

jobs:
  e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      
      - name: Start development environment
        run: |
          echo "Starting development services..."
          docker-compose --profile dev up -d web-dev api dynamodb-local
          echo "Services started:"
          docker-compose ps
      
      - name: Wait for services to be ready
        run: |
          echo "Waiting for web-dev to be ready..."
          timeout 120 bash -c 'until curl -sf http://localhost:4200 > /dev/null; do sleep 2; done'
          echo "Web dev is ready!"
          
          echo "Waiting for API to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health > /dev/null; do sleep 2; done'
          echo "API is ready!"
      
      - name: Run E2E tests
        run: |
          echo "Running E2E tests..."
          docker-compose --profile e2e-test run --rm web-e2e-test
      
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots/
          retention-days: 7
      
      - name: Upload videos on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: web/cypress/videos/
          retention-days: 7
      
      - name: Show logs on failure
        if: failure()
        run: |
          echo "=== Web Dev Logs ==="
          docker-compose logs web-dev
          echo "=== API Logs ==="
          docker-compose logs api
          echo "=== DynamoDB Logs ==="
          docker-compose logs dynamodb-local
      
      - name: Cleanup
        if: always()
        run: |
          docker-compose --profile dev --profile e2e-test down -v
          docker system prune -f

  e2e-tests-summary:
    name: E2E Tests Summary
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    
    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
            echo "✅ All E2E tests passed!"
            exit 0
          else
            echo "❌ E2E tests failed!"
            exit 1
          fi
