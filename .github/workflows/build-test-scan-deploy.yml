name: Build, Test, Security Scan and Deploy

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: startsWith(github.head_ref, 'feature/')
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: filter
        run: |
          # Get changed files
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Check for web changes
          if echo "$CHANGED_FILES" | grep -q "^web/"; then
            echo "web=true" >> $GITHUB_OUTPUT
            echo "✅ Web changes detected"
          else
            echo "web=false" >> $GITHUB_OUTPUT
            echo "⏭️  No web changes"
          fi
          
          # Check for api changes
          if echo "$CHANGED_FILES" | grep -q "^api/"; then
            echo "api=true" >> $GITHUB_OUTPUT
            echo "✅ API changes detected"
          else
            echo "api=false" >> $GITHUB_OUTPUT
            echo "⏭️  No API changes"
          fi

      - name: Changes summary
        run: |
          echo "## 🔍 Changes Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Changed |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|---------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.filter.outputs.web }}" == "true" ]; then
            echo "| 🌐 Web | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🌐 Web | ⏭️ No |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ steps.filter.outputs.api }}" == "true" ]; then
            echo "| 🔌 API | ✅ Yes |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔌 API | ⏭️ No |" >> $GITHUB_STEP_SUMMARY
          fi

  version-check-web:
    name: Web Version Validation
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.web == 'true'
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Get versions
        id: get-versions
        run: |
          PR_VERSION=$(node -p "require('./web/package.json').version")
          
          # Verifica se package.json existe na main
          if [ -f "./main-branch/web/package.json" ]; then
            MAIN_VERSION=$(node -p "require('./main-branch/web/package.json').version")
            echo "main_exists=true" >> $GITHUB_OUTPUT
            echo "📦 Main Version: $MAIN_VERSION"
          else
            MAIN_VERSION="0.0.0"
            echo "main_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️  Main branch does not have package.json - skipping version check"
          fi
          
          echo "pr_version=$PR_VERSION" >> $GITHUB_OUTPUT
          echo "main_version=$MAIN_VERSION" >> $GITHUB_OUTPUT
          echo "📦 PR Version: $PR_VERSION"

      - name: Compare versions
        if: steps.get-versions.outputs.main_exists == 'true'
        run: |
          PR_VERSION="${{ steps.get-versions.outputs.pr_version }}"
          MAIN_VERSION="${{ steps.get-versions.outputs.main_version }}"
          
          # Função para converter versão em número comparável
          version_to_number() {
            echo "$1" | awk -F. '{ printf("%d%03d%03d", $1, $2, $3) }'
          }
          
          PR_NUM=$(version_to_number "$PR_VERSION")
          MAIN_NUM=$(version_to_number "$MAIN_VERSION")
          
          echo "PR Version Number: $PR_NUM"
          echo "Main Version Number: $MAIN_NUM"
          
          if [ "$PR_NUM" -le "$MAIN_NUM" ]; then
            echo "❌ ERROR: PR version ($PR_VERSION) must be greater than main version ($MAIN_VERSION)"
            exit 1
          else
            echo "✅ SUCCESS: PR version ($PR_VERSION) is greater than main version ($MAIN_VERSION)"
          fi

      - name: Version check summary
        if: always()
        run: |
          echo "## 📋 Version Check Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **PR Branch Version:** \`${{ steps.get-versions.outputs.pr_version }}\`" >> $GITHUB_STEP_SUMMARY
          
          MAIN_EXISTS="${{ steps.get-versions.outputs.main_exists }}"
          
          if [ "$MAIN_EXISTS" == "true" ]; then
            echo "- **Main Branch Version:** \`${{ steps.get-versions.outputs.main_version }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            PR_VERSION="${{ steps.get-versions.outputs.pr_version }}"
            MAIN_VERSION="${{ steps.get-versions.outputs.main_version }}"
            
            version_to_number() {
              echo "$1" | awk -F. '{ printf("%d%03d%03d", $1, $2, $3) }'
            }
            
            PR_NUM=$(version_to_number "$PR_VERSION")
            MAIN_NUM=$(version_to_number "$MAIN_VERSION")
            
            if [ "$PR_NUM" -le "$MAIN_NUM" ]; then
              echo "### ❌ Version Check Failed" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "The PR version must be greater than the main branch version." >> $GITHUB_STEP_SUMMARY
            else
              echo "### ✅ Version Check Passed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Main Branch Version:** N/A (package.json not found)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ⚠️ Version Check Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Main branch does not have a package.json file. Version validation skipped." >> $GITHUB_STEP_SUMMARY
          fi

  build-and-test-web:
    name: Web Build and Test
    needs: [detect-changes, version-check-web]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.web == 'true'
    
    strategy:
      matrix:
        node-version: [24.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Lint check
        working-directory: ./web
        run: npm run lint --if-present || echo "No lint script found, skipping..."
        continue-on-error: true

      - name: Run tests
        working-directory: ./web
        run: npm test
        env:
          CI: true

      - name: Build project
        working-directory: ./web
        run: npm run build:prod

      - name: Check build output
        working-directory: ./web
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build output directory exists"
            du -sh dist
            ls -la dist
          else
            echo "❌ Build output directory not found"
            exit 1
          fi

      - name: Build and Test Summary
        if: always()
        working-directory: ./web
        run: |
          echo "## 🏗️ Build and Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "dist" ]; then
            DIST_SIZE=$(du -sh dist | cut -f1)
            echo "- **Build Output Size:** $DIST_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Build Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Build Failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: web/dist/
          retention-days: 7

  test-api:
    name: API Test
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    
    strategy:
      matrix:
        python-version: ['3.11']
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        working-directory: ./api
        run: |
          pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codacy
        if: success()
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: api/coverage.xml
        continue-on-error: true

      - name: Test Summary
        if: always()
        working-directory: ./api
        run: |
          echo "## 🧪 API Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version:** ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "coverage.xml" ]; then
            echo "### ✅ Tests Passed with Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Coverage report uploaded to Codacy for analysis." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Tests Failed" >> $GITHUB_STEP_SUMMARY
          fi

  codacy-security-scan:
    name: Codacy Security Scan
    needs: [detect-changes, test-api]
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.api == 'true'
    
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@master
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647
        continue-on-error: true

      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
        continue-on-error: true

      - name: Security Scan Summary
        if: always()
        run: |
          echo "## 🔒 Codacy Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Scan Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Security Scan Completed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Results have been uploaded to GitHub Security tab." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Security Scan Completed with Issues" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Review the scan results in the Security tab for potential vulnerabilities." >> $GITHUB_STEP_SUMMARY
          fi

  pr-status:
    name: PR Status Check
    needs: [detect-changes, version-check-web, build-and-test-web, test-api, codacy-security-scan]
    runs-on: ubuntu-latest
    if: always() && startsWith(github.head_ref, 'feature/')
    
    steps:
      - name: Check all jobs status
        run: |
          WEB_CHANGES="${{ needs.detect-changes.outputs.web }}"
          API_CHANGES="${{ needs.detect-changes.outputs.api }}"
          
          FAILED=false
          
          # Check web jobs if web changes detected
          if [ "$WEB_CHANGES" == "true" ]; then
            if [ "${{ needs.version-check-web.result }}" != "success" ] || [ "${{ needs.build-and-test-web.result }}" != "success" ]; then
              echo "❌ Web validation failed"
              echo "- Version Check: ${{ needs.version-check-web.result }}"
              echo "- Build and Test: ${{ needs.build-and-test-web.result }}"
              FAILED=true
            fi
          fi
          
          # Check api jobs if api changes detected
          if [ "$API_CHANGES" == "true" ]; then
            if [ "${{ needs.test-api.result }}" != "success" ]; then
              echo "❌ API validation failed"
              echo "- Test: ${{ needs.test-api.result }}"
              FAILED=true
            fi
            
            # Security scan is informational only (continue-on-error)
            if [ "${{ needs.codacy-security-scan.result }}" == "failure" ]; then
              echo "⚠️  Security scan found issues (non-blocking)"
              echo "- Codacy Security Scan: ${{ needs.codacy-security-scan.result }}"
            fi
          fi
          
          if [ "$FAILED" == "true" ]; then
            exit 1
          else
            echo "✅ All checks passed successfully"
          fi

      - name: Final Summary
        if: always()
        run: |
          echo "## 🎯 PR Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          WEB_CHANGES="${{ needs.detect-changes.outputs.web }}"
          API_CHANGES="${{ needs.detect-changes.outputs.api }}"
          
          # Web checks
          if [ "$WEB_CHANGES" == "true" ]; then
            echo "### 🌐 Web Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            
            VERSION_ICON="❌"
            if [ "${{ needs.version-check-web.result }}" == "success" ]; then
              VERSION_ICON="✅"
            fi
            echo "| Version Check | $VERSION_ICON ${{ needs.version-check-web.result }} |" >> $GITHUB_STEP_SUMMARY
            
            BUILD_ICON="❌"
            if [ "${{ needs.build-and-test-web.result }}" == "success" ]; then
              BUILD_ICON="✅"
            fi
            echo "| Build and Test | $BUILD_ICON ${{ needs.build-and-test-web.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # API checks
          if [ "$API_CHANGES" == "true" ]; then
            echo "### 🔌 API Validation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
            
            TEST_ICON="❌"
            if [ "${{ needs.test-api.result }}" == "success" ]; then
              TEST_ICON="✅"
            fi
            echo "| Tests | $TEST_ICON ${{ needs.test-api.result }} |" >> $GITHUB_STEP_SUMMARY
            
            SECURITY_ICON="⚠️"
            if [ "${{ needs.codacy-security-scan.result }}" == "success" ]; then
              SECURITY_ICON="✅"
            elif [ "${{ needs.codacy-security-scan.result }}" == "skipped" ]; then
              SECURITY_ICON="⏭️"
            fi
            echo "| Security Scan | $SECURITY_ICON ${{ needs.codacy-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Final status
          if ([ "$WEB_CHANGES" == "true" ] && ([ "${{ needs.version-check-web.result }}" != "success" ] || [ "${{ needs.build-and-test-web.result }}" != "success" ])) || ([ "$API_CHANGES" == "true" ] && [ "${{ needs.test-api.result }}" != "success" ]); then
            echo "### ❌ PR needs attention before merging" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ PR is ready to merge!" >> $GITHUB_STEP_SUMMARY
            
            # Add security scan note if there were issues
            if [ "$API_CHANGES" == "true" ] && [ "${{ needs.codacy-security-scan.result }}" == "failure" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "⚠️ **Note:** Security scan detected potential issues. Please review the Security tab before merging." >> $GITHUB_STEP_SUMMARY
            fi
          fi

  deploy-api-dev:
    name: Deploy API to DEV
    needs: [detect-changes, test-api, codacy-security-scan, pr-status]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.detect-changes.outputs.api == 'true' && 
      needs.test-api.result == 'success' &&
      (needs.codacy-security-scan.result == 'success' || needs.codacy-security-scan.result == 'failure') &&
      needs.pr-status.result == 'success'
    environment:
      name: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.0

      - name: Build Lambda deployment package
        working-directory: ./api
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Terraform Init
        working-directory: ./api/infra
        run: |
          terraform init -backend-config="backends/dev.tfvars"

      - name: Terraform Plan
        working-directory: ./api/infra
        run: |
          terraform plan -var-file="environments/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        working-directory: ./api/infra
        run: terraform apply -auto-approve tfplan

      - name: Get API Gateway URL
        id: get-url
        working-directory: ./api/infra
        run: |
          API_URL=$(terraform output -raw api_gateway_url)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT
          echo "🌐 API URL: $API_URL"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 DEV Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "- **API URL:** ${{ steps.get-url.outputs.api_url }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi

  deploy-web-dev:
    name: Deploy Web to DEV
    needs: [detect-changes, version-check-web, build-and-test-web, pr-status]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.detect-changes.outputs.web == 'true' &&
      needs.version-check-web.result == 'success' &&
      needs.build-and-test-web.result == 'success' &&
      needs.pr-status.result == 'success'
    environment:
      name: dev
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build project
        working-directory: ./web
        run: npm run build:prod

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Deploy to S3
        working-directory: ./web
        run: |
          # TODO: Add S3 bucket deployment
          echo "Web deployment to S3 - TO BE IMPLEMENTED"
          echo "Environment: dev"

      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 DEV Web Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          fi
