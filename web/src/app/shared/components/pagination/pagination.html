<nav *ngIf="totalPages > 1" aria-label="Navegação de página">
  <ul class="pagination pagination-sm justify-content-center mb-0 mt-2">
    <li class="page-item" [class.disabled]="currentPage === 1">
      <a class="page-link" (click)="goToPage(currentPage - 1)" tabindex="-1">Anterior</a>
    </li>
    <li class="page-item" *ngFor="let page of pages" [class.active]="currentPage === page">
      <a class="page-link" (click)="goToPage(page)">{{ page }}</a>
    </li>
    <li class="page-item" [class.disabled]="currentPage === totalPages">
      <a class="page-link" (click)="goToPage(currentPage + 1)">Próxima</a>
    </li>
  </ul>
</nav>
