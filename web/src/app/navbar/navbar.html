<!-- src/app/layout/navbar/navbar.component.html -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" routerLink="/">Controle de Vendas</a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isCollapsed"
      aria-controls="mainNavbar"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar" [class.show]="!isCollapsed">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/clientes" routerLinkActive="active" (click)="closeMenu()">
            Clientes
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/vendas-prazo" routerLinkActive="active" (click)="closeMenu()">
            Vendas a Prazo
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/vendas-avulso" routerLinkActive="active" (click)="closeMenu()">
            Vendas Avulso
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/pagamentos" routerLinkActive="active" (click)="closeMenu()">
            Pagamentos
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/usuarios" routerLinkActive="active" (click)="closeMenu()">
            Usuários
          </a>
        </li>
        <li class="nav-item">
          <button class="nav-link btn btn-link text-danger" (click)="logout()">
            Sair
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
