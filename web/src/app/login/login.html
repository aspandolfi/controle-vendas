<div class="login-container">
  <div class="login-card">
    <div class="text-center mb-4">
      <h1 class="mb-2">Controle de Vendas</h1>
      <p class="text-muted">Faça login para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label for="username" class="form-label">Usuário</label>
        <input 
          type="text" 
          id="username" 
          class="form-control" 
          formControlName="username"
          placeholder="Digite seu usuário"
        />
        <div 
          class="text-danger small mt-1" 
          *ngIf="loginForm.get('username')?.touched && loginForm.get('username')?.invalid"
        >
          Usuário é obrigatório
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Senha</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          formControlName="password"
          placeholder="Digite sua senha"
        />
        <div 
          class="text-danger small mt-1" 
          *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
        >
          Senha é obrigatória
        </div>
      </div>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn btn-primary w-100">
        Entrar
      </button>

      <div class="mt-3 text-center">
        <small class="text-muted">
          Usuário de teste: <strong>admin</strong> / Senha: <strong>admin</strong>
        </small>
      </div>
    </form>
  </div>
</div>
